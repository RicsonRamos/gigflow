[project]
name = "gigflow"
version = "0.1.0"
description = "Autonomous freelance intelligence, proposal generation, and multi-platform bidding engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "patchright>=1.64.4",
    "playwright>=1.40.0",
    "playwright-stealth>=2.0.3",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gemini = [
    "google-generativeai>=0.4.0",
]

[tool.uv]
package = false
link-mode = "copy"
